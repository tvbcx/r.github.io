        border-color: #e4e7ee;

      #markas-btn-label:hover {

        border-color: #ffffff;

    @media (min-width: 641px) {

    @media (min-width: 641px) {

        background-color: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        backdrop-filter: blur(10px);

        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.3);
        color: #eaeef5;
        font-weight: 600;

      #show-genres {

        background-color: rgba(0, 0, 0, 0.28);

        -webkit-backdrop-filter: blur(10px);

<script>
(function () {
var btn = document.querySelector('.footer-email-btn');
if (!btn) return;

function fallbackCopy(text) {
var ta = document.createElement('textarea');
ta.value = text;
ta.style.position = 'fixed';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.focus();
ta.select();
try { document.execCommand('copy'); } catch (e) {}
document.body.removeChild(ta);
}

function showCopied() {
btn.classList.remove('-copied');
void btn.offsetWidth;
btn.classList.add('-copied');
clearTimeout(btn._copiedTimeout);
btn._copiedTimeout = setTimeout(function () {
btn.classList.remove('-copied');
}, 1400);
}

btn.addEventListener('click', function () {
var email = btn.getAttribute('data-email');
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(email).then(showCopied).catch(function () {
fallbackCopy(email);
showCopied();
});
} else {
fallbackCopy(email);
showCopied();
}
});
})();
</script>

  <div id="page-loading-overlay" class="page-loading-overlay">
    <div class="spinner">
      <div></div><div></div><div></div><div></div><div></div><div></div>
    </div>
  </div>

  <script>
    (function () {
      var TMDB_API_KEY = '6cb6e1dc603bc65ffb6198489d5bc5b7';
      var TMDB_BASE = 'https://api.themoviedb.org/3';
      var POSTER_BASE = 'https://image.tmdb.org/t/p/w500';
      var BACKDROP_BASE = 'https://image.tmdb.org/t/p/original';

      var statusEl = document.getElementById('show-status');
      var hero = document.getElementById('show-hero');
      var backdropImage = document.querySelector('.js-show-backdrop-image');

      var trailerCluster = document.getElementById('watchlist-cluster');
      var trailerBtn = document.getElementById('trailer-btn');
      var trailerTimers = [];

      function pickTrailerUrl(show) {
        var results = (show.videos && show.videos.results) || [];
        var onYouTube = results.filter(function (v) { return v.site === 'YouTube'; });

        function first(pred) {
          var matches = onYouTube.filter(pred);
          return matches.length ? matches[0] : null;
        }

        var best =
          first(function (v) { return v.type === 'Trailer' && v.official && v.iso_639_1 === 'en'; }) ||
          first(function (v) { return v.type === 'Trailer' && v.official; }) ||
          first(function (v) { return v.type === 'Trailer' && v.iso_639_1 === 'en'; }) ||
          first(function (v) { return v.type === 'Trailer'; }) ||
          first(function (v) { return v.type === 'Teaser' && v.official; }) ||
          first(function (v) { return v.type === 'Teaser'; });

        return best ? ('https://www.youtube.com/watch?v=' + best.key) : null;
      }

      function clearTrailerTimers() {
        for (var i = 0; i < trailerTimers.length; i++) clearTimeout(trailerTimers[i]);
        trailerTimers = [];
      }

      function setupTrailerReveal(show) {
        clearTrailerTimers();
        trailerCluster.classList.remove('-split');
        trailerBtn.setAttribute('tabindex', '-1');
        trailerBtn.setAttribute('aria-hidden', 'true');
        trailerBtn.onclick = null;

        var url = pickTrailerUrl(show);
        if (!url) return;

        trailerBtn.onclick = function () {
          window.open(url, '_blank', 'noopener');
        };

        trailerTimers.push(setTimeout(function () {
          trailerCluster.classList.add('-split');
          trailerBtn.setAttribute('tabindex', '0');
          trailerBtn.setAttribute('aria-hidden', 'false');

          trailerTimers.push(setTimeout(function () {
            trailerCluster.classList.remove('-split');
            trailerBtn.setAttribute('tabindex', '-1');
            trailerBtn.setAttribute('aria-hidden', 'true');
          }, 2500));
        }, 1200));
      }

      var SPINNER_HTML =
        '<div class="spinner -inline"><div></div><div></div><div></div><div></div><div></div><div></div></div>';

      function setStatus(html, isError) {
        if (!html) {
          statusEl.hidden = true;
          statusEl.innerHTML = '';
          statusEl.classList.remove('-error');
          return;
        }
        statusEl.hidden = false;
        statusEl.innerHTML = html;
        statusEl.classList.toggle('-error', !!isError);
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
      }

      function yearFromDate(dateStr) {
        return dateStr ? dateStr.slice(0, 4) : null;
      }

      function statusLabel(status) {
        return status || null;
      }

      var params = new URLSearchParams(window.location.search);
      var showId = params.get('id');
      var imdbId = params.get('imdb');

      var SHOW_CACHE_PREFIX = 'tvbox:show:';
      var SHOW_CACHE_TTL_MS = 30 * 60 * 1000;

      function readShowCache(id) {
        try {
          var raw = sessionStorage.getItem(SHOW_CACHE_PREFIX + id);
          if (!raw) return null;
          var p = JSON.parse(raw);
          if (!p || (Date.now() - p.ts) > SHOW_CACHE_TTL_MS) return null;
          return p.data;
        } catch (e) { return null; }
      }

      function writeShowCache(id, data) {
        try { sessionStorage.setItem(SHOW_CACHE_PREFIX + id, JSON.stringify({ ts: Date.now(), data: data })); } catch (e) {}
      }

      function loadShow(id) {
        var cachedShow = readShowCache(id);
        if (cachedShow) {
          try { renderShow(cachedShow); return; } catch (e) {}
        }

        setStatus(SPINNER_HTML);

        fetch(TMDB_BASE + '/tv/' + encodeURIComponent(id) + '?api_key=' + TMDB_API_KEY + '&append_to_response=external_ids,videos')
          .then(function (res) {
            if (!res.ok) throw new Error('TMDB request failed (' + res.status + ')');
            return res.json();
          })
          .then(function (show) {
            writeShowCache(id, show);
            renderShow(show);
          })
          .catch(function (err) {
            setStatus('Something went wrong: ' + err.message, true);
          });
      }

      if (showId) {
        loadShow(showId);
      } else if (imdbId) {
        setStatus(SPINNER_HTML);
        fetch('/tmdb-data.json')
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (d) { return d && d.shows && d.shows[imdbId] && d.shows[imdbId].id; })
          .catch(function () { return null; })
          .then(function (knownId) {
            if (knownId) { loadShow(knownId); return; }
            return fetch(TMDB_BASE + '/find/' + encodeURIComponent(imdbId) + '?api_key=' + TMDB_API_KEY + '&external_source=imdb_id')
              .then(function (res) {
                if (!res.ok) throw new Error('TMDB request failed (' + res.status + ')');
                return res.json();
              })
              .then(function (found) {
                var match = found.tv_results && found.tv_results[0];
                if (!match) throw new Error('No matching show found on TMDB');
                loadShow(match.id);
              });
          })
          .catch(function (err) {
            setStatus('Something went wrong: ' + err.message, true);
          });
      } else {
        setStatus('No show selected. Head back to <a href="/search/">search</a> and pick one.', true);
      }

      function renderShow(show) {
            setStatus('');

            var backdropUrl = show.backdrop_path
              ? BACKDROP_BASE + show.backdrop_path
              : (show.poster_path ? BACKDROP_BASE + show.poster_path : null);
            if (backdropUrl) {
              var preload = new Image();
              preload.onload = function () {
                backdropImage.style.backgroundImage = 'url("' + backdropUrl + '")';
                backdropImage.classList.add('is-loaded');
              };
              preload.src = backdropUrl;
            }

            var posterImg = document.getElementById('show-poster-img');
            posterImg.src = show.poster_path ? POSTER_BASE + show.poster_path : 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
            posterImg.alt = show.name || '';

            document.getElementById('show-title').textContent = show.name || 'Untitled';
            document.title = (show.name || 'Untitled') + ' ǀ tvbox';

            window.tvboxShowMeta = { name: show.name || 'this show', firstAirDate: show.first_air_date || null };

            var year = yearFromDate(show.first_air_date);
            var metaParts = [];
            if (year) metaParts.push('<span class="numbers">' + year + '</span>');
            var status = statusLabel(show.status);
            if (status) metaParts.push('<span>' + escapeHtml(status) + '</span>');
            if (show.number_of_seasons) {
              metaParts.push('<span>' + show.number_of_seasons + ' season' + (show.number_of_seasons === 1 ? '' : 's') + '</span>');
            }
            document.getElementById('show-meta').innerHTML = metaParts.join('<span class="show-meta-dot">·</span>');

            var genresEl = document.getElementById('show-genres');
            var genres = show.genres || [];
            if (genres.length) {
              genresEl.innerHTML = genres.map(function (g) {
                return '<span class="genre-tag">' + escapeHtml(g.name) + '</span>';
              }).join('');
            }

            document.getElementById('show-rating-value').textContent =
              show.vote_average ? show.vote_average.toFixed(1) : '–';
            document.getElementById('show-seasons-value').textContent =
              show.number_of_seasons != null ? show.number_of_seasons : '–';
            document.getElementById('show-episodes-value').textContent =
              show.number_of_episodes != null ? show.number_of_episodes : '–';

            document.getElementById('show-overview').textContent =
              show.overview || 'No description available.';

            hero.hidden = false;

            setupTrailerReveal(show);
      }
    })();
  </script>

  <script>
    (function () {
      var form = document.getElementById('home-search-form');
      var input = document.getElementById('home-search-input');
      var overlay = document.getElementById('page-loading-overlay');

      function goToResults() {
        var value = input.value.trim();
        if (!value) return;
        overlay.classList.add('-visible');
        window.location.href = '/search/?q=' + encodeURIComponent(value);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        goToResults();
      });

      input.addEventListener('search', function () {
        goToResults();
      });

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          goToResults();
        }
      });

      window.addEventListener('pageshow', function () {
        overlay.classList.remove('-visible');
      });
    })();
  </script>
  <script>
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && document.activeElement) {
        document.activeElement.blur();
      }
    });
  </script>
