name: Update TMDB data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [shows.js, scripts/build-tmdb-data.mjs]

permissions:
  contents: write

concurrency:
  group: tmdb-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build tmdb-data.json
        run: node scripts/build-tmdb-data.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmdb-data.json
          git diff --cached --quiet || (git commit -m "Update tmdb-data.json" && git pull --rebase && git push)
