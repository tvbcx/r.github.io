name: Update TMDB data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [shows.js, bio.js, scripts/build-tmdb-data.mjs]

permissions:
  contents: write

concurrency:
  group: tmdb-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stamp cache-busting versions on shows.js and bio.js
        run: |
          for f in shows.js bio.js; do
            [ -f "$f" ] || continue
            v=$(sha256sum "$f" | cut -c1-10)
            name=$(printf '%s' "$f" | sed 's/\./\\./g')
            find . -name '*.html' -not -path './.git/*' -print0 \
              | xargs -0 sed -i -E "s#/${name}\?v=[A-Za-z0-9._-]*#/${f}?v=${v}#g"
          done
      - name: Build tmdb-data.json
        run: node scripts/build-tmdb-data.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Commit if changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmdb-data.json '*.html'
          git diff --cached --quiet || (git commit -m "Update tmdb-data.json and asset versions" && git pull --rebase && git push)
